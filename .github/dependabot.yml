version: 2
updates:
  # Update minor/patch dikelompokkan jadi satu PR per minggu supaya tidak banjir PR.
  # Update major tetap PR terpisah karena biasanya butuh perubahan kode.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
