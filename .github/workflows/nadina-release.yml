name: Nadina Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versi rilis yang ditandatangani
        type: string
        required: true
      algorithm:
        description: Profil algoritma tanda tangan
        type: choice
        options:
          - ed25519
          - ecdsa-p256-sha256
          - rsa-pss-sha256
        default: ed25519
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: nadina-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SKIP_ENV_VALIDATION: 1
  NADINA_IMAGE: docker.io/reletz/nadina@sha256:590e50e5e5e23f6f8ca58c4dd3d6b90218dfcc5a5c89eef53bf893e27aaaba72
  RELEASE_ALGORITHM: ${{ inputs.algorithm || 'ed25519' }}
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  sign:
    name: Sign artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nadina-release
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Normalisasi versi
        id: version
        run: |
          set -eu
          version="$(printf '%s' "$RELEASE_VERSION" | sed 's/^v//')"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Login ke Docker Hub
        run: |
          set -eu
          if [ -n "${DOCKER_PULL_TOKEN:-}" ]; then
            printf '%s' "$DOCKER_PULL_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PULL_TOKEN: ${{ secrets.DOCKER_PULL_TOKEN }}

      - name: Tarik image nadina
        run: docker pull "$NADINA_IMAGE"

      - name: Bangun artefak rilis
        run: |
          set -eu
          mkdir -p dist out
          artifact="anmategra-${{ steps.version.outputs.value }}.zip"
          git archive --format=zip --prefix="anmategra/" -o "dist/$artifact" HEAD
          sha256sum "dist/$artifact" | tee "out/$artifact.sha256"

      - name: Buat SBOM
        run: |
          set -eu
          artifact="anmategra-${{ steps.version.outputs.value }}.zip"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/out:/out" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb fs \
            --format cyclonedx \
            --output "/out/$artifact.cdx.json" \
            --scanners license \
            --include-dev-deps \
            /src

      - name: Tandatangani artefak dan SBOM
        env:
          KEY_RSA: ${{ secrets.NADINA_KEY_RSA_PSS }}
          KEY_ECDSA: ${{ secrets.NADINA_KEY_ECDSA_P256 }}
          KEY_ED25519: ${{ secrets.NADINA_KEY_ED25519 }}
        run: |
          set -eu
          version="${{ steps.version.outputs.value }}"
          artifact="anmategra-$version.zip"

          case "$RELEASE_ALGORITHM" in
            rsa-pss-sha256) key="$KEY_RSA" ;;
            ecdsa-p256-sha256) key="$KEY_ECDSA" ;;
            ed25519) key="$KEY_ED25519" ;;
          esac
          test -n "$key"

          umask 077
          key_file="$RUNNER_TEMP/signing.key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$key" > "$key_file"

          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/out:/output" \
            -v "$key_file:/run/signing.key.pem:ro" \
            "$NADINA_IMAGE" sign \
            --file "/input/$artifact" \
            --package anmategra \
            --version "$version" \
            --key /run/signing.key.pem \
            --out "/output/$artifact.bundle.json"

          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/out:/output" \
            "$NADINA_IMAGE" sbom bind \
            --file "/input/$artifact" \
            --sbom "/output/$artifact.cdx.json" \
            --out "/output/$artifact.sbom.json"

          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/out:/output" \
            -v "$key_file:/run/signing.key.pem:ro" \
            "$NADINA_IMAGE" sbom sign \
            --sbom "/output/$artifact.sbom.json" \
            --package anmategra \
            --version "$version" \
            --key /run/signing.key.pem \
            --out "/output/$artifact.sbom.bundle.json"

      - name: Verifikasi
        run: |
          set -eu
          version="${{ steps.version.outputs.value }}"
          artifact="anmategra-$version.zip"

          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/out:/output:ro" \
            -v "$PWD/ci/trust.json:/trust.json:ro" \
            "$NADINA_IMAGE" verify \
            --file "/input/$artifact" \
            --bundle "/output/$artifact.bundle.json" \
            --trust-store /trust.json \
            --package anmategra \
            --version "$version" \
            --json | tee "out/$artifact.verification.json"

          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/out:/output:ro" \
            -v "$PWD/ci/trust.json:/trust.json:ro" \
            "$NADINA_IMAGE" sbom verify \
            --file "/input/$artifact" \
            --bundle "/output/$artifact.bundle.json" \
            --sbom "/output/$artifact.sbom.json" \
            --sbom-bundle "/output/$artifact.sbom.bundle.json" \
            --trust-store /trust.json \
            --package anmategra \
            --version "$version" \
            --json | tee "out/$artifact.sbom.verification.json"

          grep -q '"valid":true' "out/$artifact.verification.json"
          grep -q '"valid":true' "out/$artifact.sbom.verification.json"
          printf 'anmategra %s %s\n' "$version" "$RELEASE_ALGORITHM" > out/deployed.txt

      - name: Catat identitas
        if: always()
        run: |
          mkdir -p out
          printf '%s\n' "$NADINA_IMAGE" > out/image.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > out/run-url.txt
          {
            echo "### Nadina Release"
            echo "- artifact: anmategra-${{ steps.version.outputs.value }}.zip"
            echo "- image: $NADINA_IMAGE"
            echo "- algorithm: $RELEASE_ALGORITHM"
            for f in out/*.verification.json; do
              if [ -f "$f" ]; then echo "- $(basename "$f"): $(cat "$f")"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nadina-release-${{ steps.version.outputs.value }}
          path: out/
          if-no-files-found: warn

  deploy:
    name: Deploy (simulasi)
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nadina-release-${{ needs.sign.outputs.version }}
          path: out
      - name: Tandai deploy
        run: |
          set -eu
          test -s out/deployed.txt
          artifact="anmategra-${{ needs.sign.outputs.version }}.zip"
          test -s "out/$artifact.verification.json"
          test -s "out/$artifact.sbom.verification.json"
          printf 'deploy anmategra %s terverifikasi\n' "${{ needs.sign.outputs.version }}" > deployed.txt
