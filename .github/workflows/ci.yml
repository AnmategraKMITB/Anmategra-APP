name: CI - Build Check

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Docs di docs/api/ di-generate dari router tRPC dan schema Drizzle.
      # Kalau ada procedure/tabel baru tapi docs belum di-regenerate, step ini gagal.
      # Perbaikannya: jalankan `npm run docs` lalu commit hasilnya.
      - name: Check generated docs are up to date
        run: npm run docs:check
        env:
          SKIP_ENV_VALIDATION: 1

      - name: Build Project
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: 1
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}