name: CI

on:
  pull_request:
    branches: ['develop']
  # Merge queue: tiap PR diuji lagi di atas develop terbaru, dengan seluruh tes,
  # sebelum benar-benar masuk.
  merge_group:
  # Tiap PR lulus CI sendiri-sendiri, tetapi beberapa PR yang di-merge berurutan
  # tanpa rebase bisa rusak saat digabung (mis. bun.lock hasil merge
  # otomatis membuat `bun install --frozen-lockfile` gagal). Jalankan lagi setelah merge ke develop.
  # Run di develop juga mengisi cache yang dibaca PR.
  push:
    branches: ['develop']

# Push baru ke PR yang sama membatalkan run sebelumnya. Run di develop dan merge
# queue tidak dibatalkan supaya setiap commit yang masuk tetap tercatat hasilnya.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SKIP_ENV_VALIDATION: 1

# Tiga job berjalan paralel dan tidak ada yang menunggu job lain. Tiap job
# punya anggaran waktu (langkah terakhir); melewatinya membuat job gagal.
jobs:
  checks:
    # Semua pengecekan kecil sekaligus; semua kegagalan dicetak di akhir.
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anmategra
    steps:
      - run: sh -c 'date +%s > "$RUNNER_TEMP/job-start"'
      # Database kosong untuk pengecekan migrasi. Dijalankan duluan supaya
      # booting bersamaan dengan checkout dan install.
      - name: Start Postgres
        run: >-
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres
          -e POSTGRES_DB=anmategra --tmpfs /var/lib/postgresql/data postgres:15-alpine
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun
      # Lewat TCP: server sementara saat initdb hanya mendengar socket Unix.
      - name: Wait for Postgres
        run: timeout 30 sh -c 'until docker exec pg pg_isready -h 127.0.0.1 -U postgres -q; do sleep 0.2; done'
      # Lint, format, tipe, docs, migrasi, drift schema. Lihat skripnya untuk
      # cara memperbaiki tiap kegagalan.
      - run: bash scripts/ci/checks.sh
      - run: sh scripts/ci/budget.sh check 90

  build:
    # Nama ini dipakai sebagai required status check di branch protection.
    name: Build and Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: sh -c 'date +%s > "$RUNNER_TEMP/job-start"'
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'content/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build
        env:
          # PR dari fork tidak mendapat secrets; build tetap butuh URL (robots/sitemap).
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'https://anmategra.com' }}

      # `next build` tidak lagi mengecek tipe sendiri (lihat next.config.js). Tipe
      # rute yang ia buat di .next/types (lebih banyak dari `next typegen`) dicek di sini.
      - name: Check types of the build output
        run: bun check --no-script
      - run: sh scripts/ci/budget.sh check 180

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tiap worker `bun test` membuat database sendiri: anmategra_test_w<n>.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anmategra_test
    steps:
      - run: sh -c 'date +%s > "$RUNNER_TEMP/job-start"'
      # Postgres sekali pakai di tmpfs tanpa fsync: TRUNCATE per tes ~10x lebih
      # cepat. Tidak lewat `services` karena butuh argumen server. Dijalankan
      # duluan supaya booting bersamaan dengan checkout dan install.
      - name: Start Postgres
        run: >-
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres
          --tmpfs /var/lib/postgresql/data postgres:15-alpine
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun
      # Lewat TCP: server sementara saat initdb hanya mendengar socket Unix.
      - name: Wait for Postgres
        run: timeout 30 sh -c 'until docker exec pg pg_isready -h 127.0.0.1 -U postgres -q; do sleep 0.2; done'
      - run: bun run test
      - run: sh scripts/ci/budget.sh check 120

  dependency-review:
    name: Dependency review
    # Butuh dependency graph dan GitHub Advanced Security. Dilewati selama
    # variabel repo GHAS_ENABLED belum bernilai true (lihat codeql.yml).
    if: github.event_name == 'pull_request' && vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Menolak PR yang menambah dependency dengan kerentanan high/critical.
      # Kerentanan yang sudah ada di develop tidak membuat PR gagal.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
