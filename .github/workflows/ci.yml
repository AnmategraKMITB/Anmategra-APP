name: CI

on:
  pull_request:
    branches: ['develop']
  # Tiap PR lulus CI sendiri-sendiri, tetapi beberapa PR yang di-merge berurutan
  # tanpa rebase bisa rusak saat digabung (mis. bun.lock hasil merge
  # otomatis membuat `bun install --frozen-lockfile` gagal). Jalankan lagi setelah merge ke develop.
  push:
    branches: ['develop']

# Push baru ke PR yang sama membatalkan run sebelumnya. Run di develop tidak
# dibatalkan supaya setiap commit yang masuk tetap tercatat hasilnya.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SKIP_ENV_VALIDATION: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun
      # Pelanggaran lama dicatat di oxlint-suppressions.json; pelanggaran baru gagal.
      # Kalau kamu memperbaiki pelanggaran lama, jalankan `bun run lint:prune`.
      - run: bun run lint
      - run: bun fmt --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun
      - run: bun run check

  build:
    # Nama ini dipakai sebagai required status check di branch protection.
    name: Build and Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun

      # Docs di docs/api/ di-generate dari router tRPC dan schema Drizzle.
      # Kalau ada procedure/tabel baru tapi docs belum di-regenerate, step ini gagal.
      # Perbaikannya: jalankan `bun run docs` lalu commit hasilnya.
      - name: Check generated docs are up to date
        run: bun run docs:check

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'content/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build
        env:
          # PR dari fork tidak mendapat secrets; build tetap butuh URL (robots/sitemap).
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'https://anmategra.com' }}

      # `next build` tidak lagi mengecek tipe sendiri (lihat next.config.js). Tipe
      # rute yang ia buat di .next/types (lebih banyak dari `next typegen`) dicek di sini.
      - name: Check types of the build output
        run: bun check --no-script

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tiap worker `bun test` membuat database sendiri: anmategra_test_w<n>.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anmategra_test
    steps:
      # Postgres sekali pakai di tmpfs tanpa fsync: TRUNCATE per tes ~10x lebih
      # cepat. Tidak lewat `services` karena butuh argumen server. Dijalankan
      # duluan supaya booting bersamaan dengan checkout dan install.
      - name: Start Postgres
        run: >-
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres
          --tmpfs /var/lib/postgresql/data postgres:15-alpine
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun
      # Lewat TCP: server sementara saat initdb hanya mendengar socket Unix.
      - name: Wait for Postgres
        run: timeout 30 sh -c 'until docker exec pg pg_isready -h 127.0.0.1 -U postgres -q; do sleep 0.2; done'
      - run: bun run test

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Samakan dengan versi Postgres di production.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anmategra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anmategra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-bun

      # Semua migrasi harus bisa dijalankan dari database kosong (developer baru,
      # environment baru), bukan hanya di atas database yang sudah ada.
      - name: Apply all migrations to an empty database
        run: bun run db:migrate

      # Snapshot terakhir di drizzle/meta harus sama dengan src/server/db/schema.ts.
      # Kalau gagal: jalankan `bun run db:generate`, lalu commit migrasi barunya.
      - name: Check schema.ts has no ungenerated changes
        run: |
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts berubah tanpa migrasi. Jalankan 'bun run db:generate' lalu commit hasilnya."
            git status --porcelain drizzle
            exit 1
          fi

  dependency-review:
    name: Dependency review
    # Butuh dependency graph dan GitHub Advanced Security. Dilewati selama
    # variabel repo GHAS_ENABLED belum bernilai true (lihat codeql.yml).
    if: github.event_name == 'pull_request' && vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Menolak PR yang menambah dependency dengan kerentanan high/critical.
      # Kerentanan yang sudah ada di develop tidak membuat PR gagal.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
