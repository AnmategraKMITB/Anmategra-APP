# Lingkungan pengembangan lokal: PostgreSQL (dipulihkan dari dump) + Next.js dev server.
#
#   docker compose -f compose.local.yml up --build
#
# Variabel opsional (bisa ditaruh di `.env`, yang juga dibaca compose):
#   APP_PORT      port app di host           (bawaan 3000)
#   DB_PORT       port Postgres di host      (bawaan 5433, supaya tidak bentrok dengan Postgres lokal)
#   DB_DUMP_DIR   folder berisi dump         (bawaan .., yaitu folder induk repo)
#   DB_DUMP_FILE  nama file dump             (bawaan anmategra.dump)
#
# Dump hanya dipulihkan saat volume database masih kosong. Untuk mengulang dari dump:
#   docker compose -f compose.local.yml down -v
name: anmategra-local

services:
  db:
    # Versi mayor yang sama dengan server asal dump (PostgreSQL 15).
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anmategra
      DB_DUMP_FILE: ${DB_DUMP_FILE:-anmategra.dump}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/local/initdb:/docker-entrypoint-initdb.d:ro
      - ${DB_DUMP_DIR:-..}:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anmategra"]
      interval: 2s
      timeout: 3s
      retries: 60

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/anmategra
      NEXTAUTH_URL: http://localhost:${APP_PORT:-3000}
      NEXT_PUBLIC_BASE_URL: http://localhost:${APP_PORT:-3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-secret-jangan-dipakai-di-production}
      # Placeholder: app tetap jalan, tetapi login Google/Microsoft baru berfungsi
      # jika diisi kredensial OAuth sungguhan di `.env`.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-placeholder}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-placeholder}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-db6e1183-4c65-405c-82ce-7cd53fa6e9dc}
      # Aktifkan jika hot reload tidak jalan (umumnya Docker Desktop di Windows/macOS).
      # WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
